<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Receipt — KSPVIB</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body{background:#fff}
    .receipt-wrap{max-width:900px;margin:0 auto;padding:28px}
    .printbar{text-align:right;margin-bottom:14px}
    .printbar button{padding:11px 22px;font-size:14px;border-radius:12px}
    .printbar a{margin-left:10px;font-size:14px;color:#087c3f;font-weight:700;text-decoration:none}
    .receipt{border:1px solid #e5e7eb;padding:46px 54px;min-height:900px}
    .rhead{text-align:center;border-bottom:3px solid #13864a;padding-bottom:22px}
    .logo-placeholder{width:72px;height:72px;border:2px solid #16854b;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#16854b;font-weight:800;margin-bottom:10px}
    .gov{color:#087c3f;font-size:21px;font-weight:850}
    .ministry{font-weight:800;margin-top:4px}
    .board{font-size:13px;font-weight:750;margin-top:3px}
    .tagline{font-style:italic;color:#7b8492;margin-top:5px}
    .title-row{display:flex;justify-content:space-between;gap:20px;margin:28px 0}
    .title{font-size:30px;font-weight:850}
    .meta{text-align:right}
    .meta .no{color:#087c3f;font-size:19px;font-weight:850}
    .paid{display:inline-block;margin-top:8px;background:#dff8e9;color:#087c3f;padding:7px 15px;border-radius:20px;font-weight:850}
    .intro{color:#687589;max-width:480px}
    .boxes{display:grid;grid-template-columns:1fr 1fr 1fr;background:#f6f7f9;border-radius:18px;padding:20px;margin:26px 0}
    .box{padding:0 20px;border-right:1px solid #e0e4ea}
    .box:last-child{border:0}
    .cap{font-size:11px;font-weight:850;letter-spacing:1px;color:#7a8290}
    .val{font-weight:800;margin-top:8px}
    .sub{color:#788393;margin-top:5px}
    table{width:100%;border-collapse:collapse;margin-top:25px}
    th{background:#f0f2f5;text-align:left;padding:13px;font-size:12px;letter-spacing:1px;color:#6c7480}
    td{padding:18px 13px;border-bottom:1px solid #eceef2}
    td:last-child,th:last-child{text-align:right}
    .total{margin-top:20px;background:#e9faef;border-radius:14px;padding:18px 24px;display:flex;justify-content:space-between;font-weight:800}
    .total strong{font-size:25px;color:#087c3f}
    .bottom{display:flex;justify-content:space-between;gap:30px;margin-top:48px}
    .thanks{color:#687589}
    .qr{width:170px;height:170px;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;color:#555}
    .verify-url{font-size:11px;color:#8a929f;margin-top:8px;max-width:190px;word-break:break-all;text-align:center}
    .notice{margin:30px 0;padding:16px 20px;border-radius:14px;background:#fff8e6;border:1px solid #f4e5b5;color:#715c14;font-size:14px;line-height:1.5}
    @media print{.printbar{display:none}.receipt-wrap{padding:0}.receipt{border:0}}
    @media(max-width:650px){
      .receipt{padding:30px 22px}
      .title-row,.bottom{flex-direction:column}
      .meta{text-align:left}
      .boxes{grid-template-columns:1fr;gap:18px}
      .box{border-right:0;border-bottom:1px solid #e0e4ea;padding:0 0 14px}
      .box:last-child{border:0;border-bottom:0}
      .qr{align-self:center}
    }
  </style>
</head>
<body>
<div class="receipt-wrap">
  <div class="printbar">
    <button onclick="window.print()">Print / Save as PDF</button>
    <a href="index.html">← Back to verification</a>
  </div>
  <article class="receipt" id="receipt"></article>
</div>
<script>
// Receipt data is fetched from the Node.js backend — only PAID invoices return data.
const ref = new URLSearchParams(location.search).get("inv") || "INV-2026-0001";
const el = document.getElementById("receipt");

async function load() {
  try {
    const res = await fetch(`/api/receipt/${encodeURIComponent(ref)}`);
    const data = await res.json();
    if (!res.ok) {
      el.innerHTML = `<div class="notice"><strong>Receipt unavailable.</strong> ${data.error || "This invoice has no confirmed payment."}</div>`;
      return;
    }
    render(data.receipt, data.verifyUrl);
  } catch {
    el.innerHTML = `<div class="notice"><strong>Connection error.</strong> Could not reach the verification server.</div>`;
  }
}

function render(r, verifyUrl) {
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const naira = n => "\u20A6" + Number(n).toFixed(2);
  el.innerHTML = `
    <div class="rhead">
      <div class="logo-placeholder">KSG</div>
      <div class="gov">KANO STATE GOVERNMENT</div>
      <div class="ministry">MINISTRY OF EDUCATION</div>
      <div class="board">KANO STATE PRIVATE AND VOLUNTARY INSTITUTIONS BOARD (KSPVIB)</div>
      <div class="tagline">Quality Education for a Brighter Kano</div>
    </div>
    <div class="title-row">
      <div><div class="title">Payment Receipt</div><p class="intro">This is your official receipt from the Kano State Private and Voluntary Institutions Board (KSPVIB).</p></div>
      <div class="meta"><div>Receipt for</div><div class="no">${esc(r.invoiceNumber)}</div><div>Paid: ${esc(r.paidDate)}</div><span class="paid">\u2713 PAID</span></div>
    </div>
    <div class="boxes">
      <div class="box"><div class="cap">RECEIVED FROM</div><div class="val">${esc(r.school)}</div><div class="sub">${esc(r.address !== "—" ? r.address : "")}</div><div class="sub">Ungogo, ${esc(r.state)}</div></div>
      <div class="box"><div class="cap">CATEGORY</div><div class="val">${esc(r.category)}</div></div>
      <div class="box"><div class="cap">PROPRIETOR</div><div class="val">${esc(r.proprietor)}</div></div>
    </div>
    <table><thead><tr><th>#</th><th>DESCRIPTION</th><th>AMOUNT</th></tr></thead><tbody><tr><td>1</td><td>${esc(r.description)}</td><td>${naira(r.amount)}</td></tr></tbody></table>
    <div class="total"><span>Total Paid</span><strong>${naira(r.amount)}</strong></div>
    <div class="bottom">
      <div class="thanks">Thank you for your payment.<br>Keep this receipt for your records.<br><br>Kano State Ministry of Education<br>Private and Voluntary Institutions Board (KSPVIB)</div>
      <div style="display:flex;flex-direction:column;align-items:center"><div class="qr">QR CODE<br><br>Verify at:<br>${esc(verifyUrl)}</div><div class="verify-url">Scan to verify this payment</div></div>
    </div>`;
}

load();
</script>
</body>
</html>
