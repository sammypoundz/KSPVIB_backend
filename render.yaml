services:
  - type: web
    name: kspvib-invoice-verification
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false # set this in the Render dashboard: your MongoDB Atlas connection string
      - key: MONGODB_DB
        value: KSPVIB
